[package]
name = "klyndb-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
klyndb-driver-api = { path = "../driver-api" }
klyndb-connections = { path = "../connections" }
tokio.workspace = true
tokio-util.workspace = true
async-ssh2-lite = { version = "0.5.0", features = ["tokio", "vendored-openssl", "openssl-on-win32"] }
base64 = "0.22"
async-trait.workspace = true
zeroize = "1"

[dev-dependencies]
# Independent real SSH server for authentication, forwarding and shutdown contracts.
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
rand = "0.10"
