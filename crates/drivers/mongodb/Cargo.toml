[package]
name = "klyndb-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
klyndb-driver-api = { path = "../../driver-api" }
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "redact-errors", "cert-key-password"] }
bson = { version = "3.1", features = ["serde_json-1"] }
base64 = "0.22"
async-trait.workspace = true
futures-util.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
url = "2"
percent-encoding = "2"

[dev-dependencies]
uuid.workspace = true
