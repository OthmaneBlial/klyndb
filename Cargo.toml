[workspace]
resolver = "2"
exclude = ["third_party/klickhouse-0.15.3", "third_party/tiberius-0.13.0"]
members = ["crates/driver-api", "crates/query", "crates/connections", "crates/core", "crates/ssh", "crates/export", "crates/import", "crates/drivers/sqlite", "crates/drivers/postgres", "crates/drivers/mysql", "crates/drivers/duckdb", "crates/drivers/clickhouse", "crates/drivers/mssql", "crates/drivers/redis", "crates/drivers/mongodb", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/query", "crates/connections", "crates/export", "crates/import", "crates/drivers/sqlite", "crates/drivers/postgres", "crates/drivers/mysql", "crates/drivers/duckdb", "crates/drivers/clickhouse", "crates/drivers/mssql", "crates/drivers/redis", "crates/drivers/mongodb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rusqlite = { version = "0.40", default-features = false, features = ["libsqlite3-sys", "bundled", "hooks"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
tempfile = "3"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Full native DuckDB debug data makes local test caches several GiB larger.
# Keep application/Rust debug information; the vendor C++ engine is not our debugger target.
[profile.dev.package.libduckdb-sys]
debug = 0

# Retains the pinned native client with a result-column data-loss guard.
[patch.crates-io]
klickhouse = { path = "third_party/klickhouse-0.15.3" }

tiberius = { path = "third_party/tiberius-0.13.0" }
